name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17 (ОБЯЗАТЕЛЬНО для sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade buildozer
          pip install "cython<3.0" virtualenv

      - name: Force install sdkmanager and setup SDK
        run: |
          export SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"
          mkdir -p "$SDK_DIR/tools/bin"
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d /tmp/cmdline-tools
          
          cp -r /tmp/cmdline-tools/cmdline-tools/* "$SDK_DIR/tools/"
          
          # Принудительно используем Java 17 для sdkmanager
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          
          yes | "$SDK_DIR/tools/bin/sdkmanager" --licenses || true
          "$SDK_DIR/tools/bin/sdkmanager" "platform-tools" "platforms;android-31" "build-tools;31.0.0" || true
          
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/tools/bin" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/tools/bin:$PATH"
          
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shooter-apk
          path: bin/*.apk
